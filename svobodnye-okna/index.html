<script>
/* ==========================================================================
   Врачи и геометрия макетов. Координаты — в пикселях холста 1080×1920.
   Чтобы добавить врача: положите фон в assets/, скопируйте любой блок ниже
   и поправьте числа.

const TEAL='#017B8C', PEACH_LINE='#F9C3A1';

const DOCTORS=[

  x0:66, top:802, minTop:730, maxBottom:1240,
  panel:{right:620, radius:40, fill:'#FFFFFF', stroke:PEACH_LINE, lw:2.5},

  divider:{h:3, x1:114, x2:392, color:PEACH_LINE, dotR:7.5, dotCx:399},
  rows:{cx:146.5, discR:0, clockR:30.5, lw:3, clockColor:PEACH_LINE, hands:'430',

{

  panel:null,

  date:{x:129, size:70, color:TEAL, maxRight:410,
        pill:{x0:68, dTop:-20, h:101, padRight:44, fill:'#FBDFD0'}},
  divider:null,
  rows:{cx:110, discR:41.5, discFill:'#FBDFD0', clockR:26, lw:3, clockColor:TEAL, hands:'430',
        textX:170, textOff:-32, size:71, color:TEAL}
},
{
  id:'dashicheva', name:'Дашичева Мария Михайловна',
  bg:'assets/dashicheva.jpg',
  cut:null,
  x0:85, top:702, minTop:680, maxBottom:1235,
  panel:null,
  seg:{A:11, B:178.5, C:0, P:97, D:42},
  date:{x:213, size:93, color:TEAL, maxRight:610,
        badge:{cx:138, dCy:43.5, r:53.5, fill:'#FBDBC6', iw:60, ih:61, lw:3.4, color:TEAL}},
  divider:null,
  rows:{cx:127, discR:42, discFill:'#FBDBC6', clockR:25, lw:3, clockColor:TEAL, hands:'430',
        textX:191, textOff:-31.5, size:73, color:TEAL}
}];

// насколько сильно можно ужать каждый промежуток, прежде чем уменьшать кегль
const MINF={A:.55, B:.85, C:.55, P:.95, D:.35};

const MONTHS=['января','февраля','марта','апреля','мая','июня',
              'июля','августа','сентября','октября','ноября','декабря'];

/* ====================== состояние и элементы ============================= */
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const say=(m,c)=>{$('status').textContent=m; $('status').className='status '+(c||'');};
const cache={};
let times=['14:00','15:00'];

DOCTORS.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=d.name;$('doc').appendChild(o);});
const today=new Date(); today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
$('date').value=today.toISOString().slice(0,10);

/* --- маска ЧЧ:ММ: с телефона видна цифровая клавиатура, двоеточие ставится само --- */
function splitTime(val){                                  /* часы, минуты и было ли двоеточие */
  const i=val.indexOf(':');
  let h=(i<0?val:val.slice(0,i)).replace(/\D/g,'');
  let m=(i<0?'':val.slice(i+1)).replace(/\D/g,'');
  if(h.length>2){ m=h.slice(2)+m; h=h.slice(0,2); }       /* лишнее из часов уезжает в минуты */
  return [h,m.slice(0,2),i>=0];
}
function maskTime(val,del){
  let [h,m,sep]=splitTime(val);
  if(!h && !m) return '';
  if(!sep){
    if(!del && h.length===1 && +h>2) h='0'+h;             /* 9 → 09 */
    if(h.length<2) return h;
    if(!m) return del ? h.slice(0,1) : h+':';             /* стёрли двоеточие — уносим и цифру */
  }
  return h+':'+m;
}
function fixTime(val){                                    /* дописываем до ЧЧ:ММ при потере фокуса */
  const [h,m]=splitTime(val);
  if(!h && !m) return '';
  const hh=Math.min(+h||0,23);
  const mm=Math.min(m.length===1 ? +m*10 : +m||0,59);     /* 14:3 → 14:30 */
  return ('0'+hh).slice(-2)+':'+('0'+mm).slice(-2);
}
function bindTime(inp,commit){
  let prev=inp.value;
  inp.addEventListener('input',e=>{
    const raw=inp.value;
    const kind=(e&&e.inputType)||'';                        /* если браузер не говорит тип правки — смотрим на длину */
    const del=kind ? /delete/i.test(kind) : raw.length<prev.length;
    const caret=inp.selectionStart==null?raw.length:inp.selectionStart;
    const out=maskTime(raw,del);
    if(out!==raw){
      let before=0; for(let k=0;k<caret;k++) if(raw[k]>='0'&&raw[k]<='9') before++;
      inp.value=out;
      let pos=out.length;
      if(caret<raw.length){                                      /* правка внутри строки — держим каретку у той же цифры */
        pos=0; let seen=0;
        while(pos<out.length && seen<before){ if(out[pos]>='0'&&out[pos]<='9') seen++; pos++; }
        if(out[pos]===':') pos++;
      }
      try{inp.setSelectionRange(pos,pos);}catch(_){}
    }
    prev=inp.value; commit(inp.value);
  });
  inp.addEventListener('blur',()=>{inp.value=fixTime(inp.value); prev=inp.value; commit(inp.value);});
}

function drawTimes(){
  const box=$('times'); box.innerHTML='';
  times.forEach((t,i)=>{
    const w=document.createElement('div'); w.className='tw';
    const inp=document.createElement('input');
    inp.type='text'; inp.value=t; inp.inputMode='numeric'; inp.placeholder='14:00';
    inp.maxLength=5; inp.autocomplete='off'; inp.enterKeyHint='done'; inp.setAttribute('aria-label','время '+(i+1));
    bindTime(inp,v=>{times[i]=v;render();});
    w.appendChild(inp);
    if(times.length>1){
      const b=document.createElement('b'); b.textContent='×'; b.title='убрать';
      b.addEventListener('click',()=>{times.splice(i,1);drawTimes();render();});
      w.appendChild(b);
    }
    box.appendChild(w);
  });
  $('add').style.display = times.length>=4 ? 'none' : '';
}
$('add').addEventListener('click',()=>{times.push('');drawTimes();render();});
$('doc').addEventListener('change',render);
$('date').addEventListener('change',render);
drawTimes();

/* ====================== вспомогательное рисование ======================== */
function load(src){
  if(cache[src]) return cache[src];
  cache[src]=new Promise((res,rej)=>{
    const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('не открылся '+src)); i.src=src;
  });
  return cache[src];
}
function roundRect(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
function metrics(text,size){
  ctx.font=size+'px PrataLocal';
  const m=ctx.measureText(text);
  return {w:m.actualBoundingBoxLeft+m.actualBoundingBoxRight, left:m.actualBoundingBoxLeft, asc:m.actualBoundingBoxAscent};
}
/* рисуем строку так, чтобы левый край чернил был в x, верх — в inkTop */
function inkText(text,x,inkTop,size,color){
  ctx.font=size+'px PrataLocal'; ctx.fillStyle=color; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  const m=metrics(text,size);
  ctx.fillText(text, x+m.left, inkTop+m.asc);
  return x+m.w;
}
function clock(cx,cy,r,lw,color,hands){
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='butt'; ctx.lineJoin='miter';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,cy-r*0.70); ctx.stroke();   // минутная — вверх
  ctx.beginPath(); ctx.moveTo(cx,cy);
  if(hands==='3') ctx.lineTo(cx+r*0.46,cy);                                      // часовая — вправо
  else            ctx.lineTo(cx+r*0.44,cy+r*0.46);                               // часовая — вниз-вправо
  ctx.stroke();
}
function calendar(cx,cy,w,h,lw,color){
  const x=cx-w/2, y=cy-h/2, bodyY=y+h*0.18, bodyH=h-h*0.18;
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineJoin='round'; ctx.lineCap='round';
  roundRect(ctx,x,bodyY,w,bodyH,w*0.16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,bodyY+bodyH*0.27); ctx.lineTo(x+w,bodyY+bodyH*0.27); ctx.stroke();
  [0.29,0.71].forEach(k=>{ctx.beginPath();ctx.moveTo(x+w*k,y);ctx.lineTo(x+w*k,bodyY+bodyH*0.13);ctx.stroke();});
}

/* ============================== рендер =================================== */
async function render(){
  const d=DOCTORS[+$('doc').value];
  const bg=await load(d.bg);
  const cut=d.cut? await load(d.cut.src) : null;

  const list=times.map(t=>t.trim()).filter(Boolean);
  if(!list.length) list.push('—');
  const n=list.length;
  const dv=$('date').value ? new Date($('date').value+'T12:00:00') : new Date();
  const dateStr=dv.getDate()+' '+MONTHS[dv.getMonth()];

  /* --- вписываем блок по высоте: сперва поджимаем промежутки, потом кегль --- */
  const g=d.seg;
  const f={A:1,B:1,C:1,P:1,D:1};
  const sum=()=>g.A*f.A+g.B*f.B+g.C*f.C+(n-1)*g.P*f.P+g.D*f.D;
  let total=sum();
  /* если не хватает места снизу — сперва поднимаем блок, потом поджимаем промежутки */
  const top = d.top - Math.max(0, Math.min(d.top-(d.minTop||d.top), total-(d.maxBottom-d.top)));
  const need = d.maxBottom - top;
  if(total>need){                       // подбираем общий коэффициент поджатия промежутков
    let lo=0.2, hi=1;
    for(let i=0;i<40;i++){
      const k=(lo+hi)/2;
      for(const key in f) f[key]=Math.max(k,MINF[key]);
      if(sum()>need) hi=k; else lo=k;
    }
    for(const key in f) f[key]=Math.max(lo,MINF[key]);
    total=sum();
  }
  const s = total>need ? need/total : 1;
  const SX=x=>d.x0+(x-d.x0)*s;

  const dateTop = top + g.A*f.A*s;
  const divY    = dateTop + g.B*f.B*s;
  const row1Cy  = divY + g.C*f.C*s;
  const cyOf    = i => row1Cy + i*g.P*f.P*s;
  const bottom  = cyOf(n-1) + g.D*f.D*s;

  ctx.clearRect(0,0,1080,1920);
  ctx.drawImage(bg,0,0,1080,1920);

  if(d.panel){
    roundRect(ctx,SX(d.x0),top,SX(d.panel.right)-SX(d.x0),bottom-top,d.panel.radius*s);
    ctx.fillStyle=d.panel.fill; ctx.fill();
    ctx.strokeStyle=d.panel.stroke; ctx.lineWidth=d.panel.lw*s; ctx.stroke();
  }

  /* дата: при длинном месяце кегль уменьшается, чтобы не заехать на врача */
  const D=d.date;
  let size=D.size*s;
  const maxW=SX(D.maxRight)-SX(D.x);
  let mm=metrics(dateStr,size), shrunk=false;
  if(mm.w>maxW){ size=size*maxW/mm.w; mm=metrics(dateStr,size); shrunk=true; }

  if(D.pill){
    const p=D.pill, x=SX(p.x0), right=SX(D.x)+mm.w+p.padRight*s;
    roundRect(ctx,x,dateTop+p.dTop*s,right-x,p.h*s,p.h*s/2);
    ctx.fillStyle=p.fill; ctx.fill();
  }
  if(D.badge){
    const b=D.badge, cy=dateTop+b.dCy*s;
    ctx.beginPath(); ctx.arc(SX(b.cx),cy,b.r*s,0,Math.PI*2); ctx.fillStyle=b.fill; ctx.fill();
    calendar(SX(b.cx),cy,b.iw*s,b.ih*s,b.lw*s,b.color);
  }
  inkText(dateStr,SX(D.x),dateTop,size,D.color);

  if(d.divider){
    const v=d.divider;
    ctx.fillStyle=v.color;
    ctx.fillRect(SX(v.x1),divY,SX(v.x2)-SX(v.x1),v.h*s);
    if(v.dotR){ ctx.beginPath(); ctx.arc(SX(v.dotCx),divY+v.h*s/2,v.dotR*s,0,Math.PI*2); ctx.fill(); }
  }

  const R=d.rows;
  list.forEach((t,i)=>{
    const cy=cyOf(i), cx=SX(R.cx);
    if(R.discR){ ctx.beginPath(); ctx.arc(cx,cy,R.discR*s,0,Math.PI*2); ctx.fillStyle=R.discFill; ctx.fill(); }
    clock(cx,cy,R.clockR*s,R.lw*s,R.clockColor,R.hands);
    inkText(t,SX(R.textX),cy+R.textOff*s,R.size*s,R.color);
  });

  if(cut) ctx.drawImage(cut,d.cut.x,d.cut.y);

  const notes=[];
  if(top<d.top-0.5) notes.push('блок поднят на '+Math.round(d.top-top)+' px');
  if(f.P<0.999||f.A<0.999) notes.push('промежутки поджаты');
  if(s<0.995) notes.push('кегль '+Math.round(s*100)+'%');
  if(shrunk) notes.push('дата уменьшена, чтобы не заехать на врача');
  $('fit').textContent = notes.length? 'Подгонка: '+notes.join(', ')+'.' : 'Макет как в исходнике.';
}

/* ============================== экспорт ================================== */
function fname(ext){
  const d=DOCTORS[+$('doc').value], dv=new Date($('date').value+'T12:00:00');
  const p=n=>String(n).padStart(2,'0');
  return 'Окна_'+d.name.split(' ')[0]+'_'+p(dv.getDate())+'-'+p(dv.getMonth()+1)+'.'+ext;
}
function blob(type,q){ return new Promise(r=>cv.toBlob(r,type,q)); }
async function save(type,ext,q){
  try{
    await render();
    const b=await blob(type,q), url=URL.createObjectURL(b), a=document.createElement('a');
    a.href=url; a.download=fname(ext); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    say('Готово: '+fname(ext),'ok');
  }catch(e){ say('Ошибка: '+e.message,'err'); }
}
$('png').addEventListener('click',()=>save('image/png','png'));
$('jpg').addEventListener('click',()=>save('image/jpeg','jpg',0.92));

if(navigator.canShare&&navigator.share){
  $('share').style.display='';
  $('share').addEventListener('click',async()=>{
    try{
      await render();
      const b=await blob('image/jpeg',0.92);
      const f=new File([b],fname('jpg'),{type:'image/jpeg'});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); say('Отправлено','ok'); }
    }catch(e){ if(e.name!=='AbortError') say('Ошибка: '+e.message,'err'); }
  });
}

document.fonts.load('100px PrataLocal').then(()=>document.fonts.ready).then(render)
  .catch(e=>say('Не загрузился шрифт: '+e.message,'err'));
</script>
